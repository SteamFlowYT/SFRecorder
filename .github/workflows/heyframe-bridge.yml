name: Hey Frame recorder bridge checks

on:
  push:
    branches: [main]
    paths:
      - 'tab/sfrecorder_tab.py'
      - '.github/workflows/heyframe-bridge.yml'
  pull_request:
    paths:
      - 'tab/sfrecorder_tab.py'
      - '.github/workflows/heyframe-bridge.yml'
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dashboard Python syntax
        run: python3 -m py_compile tab/sfrecorder_tab.py
      - name: Check private recorder bridge and dashboard toggle
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          source = Path('tab/sfrecorder_tab.py').read_text()
          tree = ast.parse(source)
          assert any(isinstance(n, ast.ClassDef) and n.name == 'VoiceControlSocket' for n in tree.body)
          assert 'voice_bridge.poll(voice_request)' in source
          assert 'action == "voice"' in source
          assert 'def voice_request(command):' in source
          assert 'class VoiceControlSocket:' in source
          print('Recorder bridge and voice toggle syntax: PASS')
          PY
